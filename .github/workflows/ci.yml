name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: Clean PostgreSQL and MinIO integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://sift:sift-local-password@127.0.0.1:54322/sift
      POSTGRES_PASSWORD: sift-local-password
      S3_ACCESS_KEY: sift-local-access
      S3_SECRET_KEY: sift-local-secret-key
      SIFT_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start clean dependencies
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml up -d --wait postgres minio storage-gateway
      - name: Initialize object-storage bucket
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml run --rm bucket-init
      - name: Build and run production migration entrypoint
        run: npm run build:backend && npm run db:migrate:runtime
      - name: Run integration and E2E tests
        run: npm test
      - name: Show dependency logs on failure
        if: failure()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml logs postgres minio
      - name: Stop integration stack
        if: always()
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml down --volumes

  containers:
    name: Production container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend-runtime
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build dashboard runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dashboard-runtime
          push: false
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
