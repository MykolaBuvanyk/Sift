name: Memory stress

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: memory-stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  million-row-imports:
    name: 1M NDJSON and 1M CSV rows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:memory
