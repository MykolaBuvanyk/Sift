name: sift

x-app-security: &app-security
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-backend-environment: &backend-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sift}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}

services:
  postgres:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sift}
      POSTGRES_USER: ${POSTGRES_USER:-sift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sift-postgres:/var/lib/postgresql/data
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sift-minio:/data
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  storage-gateway:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:8080"
    volumes:
      - ./infra/nginx/storage-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [public, backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  bucket-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-sift-imports}
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "1"

  migrate:
    image: sift-backend:${SIFT_IMAGE_TAG:-local}
    command: [node, dist/server/database/migrate.js]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sift}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sift}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "1"

  api:
    <<: *app-security
    build:
      context: .
      target: backend-runtime
    image: sift-backend:${SIFT_IMAGE_TAG:-local}
    env_file:
      - path: ${SIFT_ENV_FILE:-.env}
        required: false
    environment:
      <<: *backend-environment
      SIFT_API_PORT: 3001
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
      storage-gateway:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    ports:
      - "${SIFT_API_PORT:-3001}:3001"
    networks: [public, backend]
    tmpfs: [/tmp]
    mem_limit: 384m
    cpus: 1.0

  worker:
    <<: *app-security
    image: sift-backend:${SIFT_IMAGE_TAG:-local}
    command: [node, dist/worker/main.js]
    env_file:
      - path: ${SIFT_ENV_FILE:-.env}
        required: false
    environment:
      <<: *backend-environment
      WORKER_HEALTH_FILE: /tmp/sift-worker-heartbeat
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "require('node:fs').stat(process.env.WORKER_HEALTH_FILE,(e,s)=>process.exit(e||Date.now()-s.mtimeMs>120000?1:0))"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [backend]
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1.0

  dashboard:
    <<: *app-security
    build:
      context: .
      target: dashboard-runtime
    image: sift-dashboard:${SIFT_IMAGE_TAG:-local}
    env_file:
      - path: ${SIFT_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      SIFT_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
      storage-gateway:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    networks: [public, backend]
    tmpfs: [/tmp, /app/.next/cache]
    mem_limit: 256m
    cpus: 0.75

networks:
  public:
  backend:
    internal: true

volumes:
  sift-minio:
  sift-postgres:
